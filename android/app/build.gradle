plugins { id 'com.android.application' }
android {
    namespace 'org.pianobarsuper.app'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pianobarsuper.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2026.09.12'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('PIANOBAR_KEYSTORE')) {
                storeFile file(System.getenv('PIANOBAR_KEYSTORE'))
                storePassword System.getenv('PIANOBAR_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PIANOBAR_KEY_ALIAS') ?: 'pianobar'
                keyPassword System.getenv('PIANOBAR_KEY_PASSWORD') ?: System.getenv('PIANOBAR_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PIANOBAR_KEYSTORE')) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
