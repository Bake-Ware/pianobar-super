# Only the configured public origin can submit browser requests. Translate that
# exact origin to the loopback upstream expected by pianobar's CSRF checks.
map $http_origin $pianobar_origin {
    default "https://invalid.invalid";
    "" "";
    "https://pianobar.example.com" "http://127.0.0.1:8765";
}
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}
server {
    listen 8080;
    server_name pianobar.example.com;
    # Tunnel connectors and local diagnostics. Other LAN hosts cannot bypass Access.
    allow 192.0.2.10;  # Replace with your trusted tunnel connector
    allow 192.0.2.11; # Replace with your second trusted connector
    allow 127.0.0.1;
    deny all;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host 127.0.0.1:8765;
        proxy_set_header Origin $pianobar_origin;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }
}
